<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#05070d" />
    <title>Ninja Motion — Fruit Ninja you play with your body</title>
    <meta name="description" content="A browser game where your webcam is the controller: slice flying fruit by swinging your hands. Real-time hand tracking with MediaPipe, entirely on-device." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%89%3C/text%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #05070d; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #stage { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
      /* Video is the background layer (mirrored); the canvas sits on top. */
      #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
      #cam.off { display: none; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
      #overlay {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px; text-align: center; color: #eaf0ff;
        background: radial-gradient(ellipse at 50% 35%, rgba(36,48,84,0.92), rgba(5,7,13,0.97) 70%);
        transition: opacity 0.35s ease;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay .fruit { font-size: clamp(46px, 9vw, 84px); filter: drop-shadow(0 8px 18px rgba(0,0,0,0.5)); animation: bob 2.4s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(-8px) rotate(6deg); } }
      #overlay h1 { font-size: clamp(38px, 7vw, 72px); letter-spacing: 0.02em; font-weight: 900; line-height: 1; }
      #overlay h1 span { color: #8ee6c8; }
      #overlay p { max-width: 34rem; color: rgba(234,240,255,0.78); line-height: 1.55; font-size: 16px; }
      .buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
      .btn {
        padding: 14px 26px; font-size: 16px; font-weight: 700; border-radius: 999px; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.18); background: transparent; color: #eaf0ff;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn:focus-visible { outline: 2px solid #8ee6c8; outline-offset: 3px; }
      .btn.primary { background: #8ee6c8; color: #05070d; border-color: #8ee6c8; box-shadow: 0 0 28px rgba(142,230,200,0.35); }
      .btn.primary:hover { box-shadow: 0 0 40px rgba(142,230,200,0.55); }
      .btn:disabled { opacity: 0.6; cursor: progress; transform: none; }
      .link { background: none; border: none; color: rgba(234,240,255,0.55); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px; }
      .link:hover { color: #eaf0ff; }
      .link:focus-visible { outline: 2px solid #8ee6c8; outline-offset: 3px; border-radius: 4px; }
      #note { font-size: 13px; color: rgba(234,240,255,0.5); }
      #error { font-size: 14px; color: #ff9aa8; min-height: 1.2em; }
      #status {
        position: absolute; bottom: 10px; left: 10px; z-index: 20; display: none;
        font: 12px ui-monospace, monospace; color: #8ee6c8; background: rgba(0,0,0,0.45);
        padding: 4px 8px; border-radius: 6px; pointer-events: none;
      }
      #status.show { display: block; }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="cam" class="off" playsinline muted></video>
      <canvas id="game" aria-label="Ninja Motion game"></canvas>
      <div id="status"></div>
      <div id="overlay">
        <div class="fruit" aria-hidden="true">🍉</div>
        <h1>NINJA <span>MOTION</span></h1>
        <p>Slice flying fruit by swinging your hands at the camera. Stand back so your hands are in frame — fast swipes cut, slow ones don't. Dodge the bombs.</p>
        <div class="buttons">
          <button id="camBtn" class="btn primary">Enable camera &amp; play</button>
        </div>
        <button id="mouseBtn" class="link">No webcam? Try it with a mouse or touchscreen instead</button>
        <div id="error" role="alert"></div>
        <div id="note">Hand tracking runs entirely on your device — no video leaves your browser.</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
