<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ninja Motion — Camera Fruit Ninja</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #05070d; overflow: hidden; font-family: system-ui, sans-serif; }
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Video is the background layer (mirrored); canvas sits on top. */
      #cam {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1); /* mirror so it feels like a mirror */
      }
      #game {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #eaf0ff;
        gap: 1rem;
        z-index: 10;
        background: rgba(5, 7, 13, 0.72);
        transition: opacity 0.4s ease;
      }
      #overlay.hidden { opacity: 0; pointer-events: none; }
      #overlay h1 { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: 0.04em; }
      #overlay p { max-width: 32rem; opacity: 0.8; line-height: 1.5; padding: 0 1rem; }
      #startBtn {
        margin-top: 0.5rem;
        padding: 0.9rem 2.2rem;
        font-size: 1.1rem;
        font-weight: 600;
        color: #05070d;
        background: #8ee6c8;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 0 24px rgba(142, 230, 200, 0.4);
      }
      #startBtn:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(142, 230, 200, 0.6); }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        font-size: 12px;
        font-family: ui-monospace, monospace;
        color: #8ee6c8;
        background: rgba(0,0,0,0.4);
        padding: 4px 8px;
        border-radius: 6px;
        z-index: 20;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="cam" playsinline muted></video>
      <canvas id="game"></canvas>
      <div id="status">booting…</div>
      <div id="overlay">
        <h1>🥷 NINJA MOTION</h1>
        <p>Stand back so your hands are in frame. Slice the flying fruit with your actual hand — no controller, just you and the camera.</p>
        <button id="startBtn">Enable Camera &amp; Play</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
